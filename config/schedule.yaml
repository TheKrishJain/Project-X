# Auto-Poster Schedule Configuration

slots:
  morning:
    # 09:00 AM IST corresponds to 03:30 AM UTC
    cron: "30 3 * * *"
    description: "Morning strategy and case study slot"
    pillars:
      monday:
        - "tech_for_business"
      tuesday:
        - "marketing_case_study"
      wednesday:
        - "ai_hack"
      thursday:
        - "business_strategy"
      friday:
        - "marketing_case_study"
        - "tech_for_business"
      saturday:
        - "ai_hack"
      sunday:
        - "business_strategy"

  night:
    # 09:00 PM IST corresponds to 15:30 PM UTC
    cron: "30 15 * * *"
    description: "Night business strategy and operational case studies slot"
    pillars:
      - name: "business_strategy"
        weight: 0.60
      - name: "tech_for_business"
        weight: 0.40
    industries:
      - "finance"
      - "marketing"
      - "operations"
      - "startups"

threads_rules: {}
