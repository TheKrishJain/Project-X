name: Auto-Post Scheduled Content

on:
  schedule:
    # Morning slot: 03:30 UTC = 09:00 AM IST
    - cron: '30 3 * * *'
    # Night slot: 15:30 UTC = 09:00 PM IST
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Posting Slot (morning / night)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night
      dry_run:
        description: 'Simulate without posting (Dry Run)'
        required: true
        default: false
        type: boolean
      day_override:
        description: 'Override weekday (e.g. thursday, tuesday)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Auto-Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET || secrets.X_ACCESS_TOKEN_SECRET }}
          X_MONTHLY_CAP: ${{ vars.X_MONTHLY_CAP || '85' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FORCE_DAY: ${{ github.event.inputs.day_override || '' }}
        run: |
          # Determine slot based on trigger or manual input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              DRY_RUN_ARG="--dry-run"
            else
              DRY_RUN_ARG=""
            fi
          else
            # Cron trigger: check current UTC hour
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 12 ]; then
              SLOT_ARG="--slot night"
            else
              SLOT_ARG="--slot morning"
            fi
            DRY_RUN_ARG=""
          fi

          python -m src.main $SLOT_ARG $DRY_RUN_ARG

      - name: Commit and push updated history & usage
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/x_usage.json
          if git diff --staged --quiet; then
            echo "No changes in data files to commit."
          else
            git commit -m "chore: auto-update post history and X usage [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:${{ github.ref_name }}
          fi
