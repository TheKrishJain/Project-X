name: Auto-Poster

on:
  schedule:
    # Morning slot: 03:45 UTC = ~09:15 AM IST
    - cron: '45 3 * * *'
    # Night slot: 15:15 UTC = ~08:45 PM IST
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Posting Slot (morning / night)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night
      dry_run:
        description: 'Simulate without publishing (Dry Run)'
        required: true
        default: false
        type: boolean
      enable_x:
        description: 'Enable X posting (Default: false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Slot and Execute Auto-Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash' }}
          QUALITY_MIN: ${{ vars.QUALITY_MIN || '7.0' }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          # Optional X Configuration (only needed if ENABLE_X="true")
          ENABLE_X: ${{ github.event.inputs.enable_x || vars.ENABLE_X || 'false' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET || secrets.X_ACCESS_TOKEN_SECRET }}
          X_MONTHLY_CAP: ${{ vars.X_MONTHLY_CAP || '85' }}
        run: |
          # 1. Determine slot based on trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ github.event.inputs.slot }}"
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              DRY_RUN_FLAG="--dry-run"
            else
              DRY_RUN_FLAG=""
            fi
            if [ "${{ github.event.inputs.enable_x }}" = "true" ]; then
              ENABLE_X_FLAG="--enable-x"
            else
              ENABLE_X_FLAG=""
            fi
          elif [ "${{ github.event.schedule }}" = "45 3 * * *" ]; then
            SLOT="morning"
            DRY_RUN_FLAG=""
            ENABLE_X_FLAG=""
          elif [ "${{ github.event.schedule }}" = "15 15 * * *" ]; then
            SLOT="night"
            DRY_RUN_FLAG=""
            ENABLE_X_FLAG=""
          else
            # Fallback based on current UTC hour
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 12 ]; then
              SLOT="night"
            else
              SLOT="morning"
            fi
            DRY_RUN_FLAG=""
            ENABLE_X_FLAG=""
          fi

          echo "Executing auto-poster for slot: $SLOT (dry_run: $DRY_RUN_FLAG, enable_x: $ENABLE_X_FLAG)"
          python -m src.main --slot "$SLOT" $DRY_RUN_FLAG $ENABLE_X_FLAG

      - name: Commit history, analytics, and reports
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json || true
          git add data/*.json || true
          git add reports/ || true

          if git diff --staged --quiet; then
            echo "No changes in data files to commit."
          else
            git commit -m "chore: auto-update post history and analytics [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:${{ github.ref_name }}
          fi
