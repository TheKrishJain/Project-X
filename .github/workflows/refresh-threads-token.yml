name: Refresh Threads Access Token

on:
  schedule:
    # Runs at 00:00 UTC on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

concurrency:
  group: refresh-token
  cancel-in-progress: false

jobs:
  refresh_token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Refresh Long-Lived Threads Token
        id: refresh
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          from src.post_threads import refresh_token

          data = refresh_token()
          new_token = data.get("access_token", "").strip()
          if not new_token:
              raise ValueError("No access_token returned by Threads API.")

          # Mask the new token in runner output logs
          print(f"::add-mask::{new_token}")

          # Write to step output for subsequent GitHub CLI step
          github_output = os.getenv("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"new_token={new_token}\n")
          print("Token refreshed and output registered.")
          EOF

      - name: Update THREADS_ACCESS_TOKEN secret in GitHub Repository
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.refresh.outputs.new_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT secret is missing. Cannot update repository secret."
            exit 1
          fi
          echo "$NEW_TOKEN" | gh secret set THREADS_ACCESS_TOKEN --repo "${{ github.repository }}"
          echo "Repository secret THREADS_ACCESS_TOKEN updated successfully."
